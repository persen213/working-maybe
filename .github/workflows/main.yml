name: Senior Add-on 1.20.1 build
on:
  workflow_dispatch:
  push:
    tags:
      - '*-v*'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Check for forbidden "particle" keyword
        run: |
          if grep -r -i "particle" --include="*.java" src/main/java/; then
            echo "ERROR: Found forbidden 'particle' keyword in Java source files"
            exit 1
          fi
          echo "No 'particle' keyword found - OK"
      - name: Build (clean build)
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: senior-forge-1.20.1
          path: build/libs/senior-forge-1.20.1-*.jar
